name: Nightly Benchmark Matrix
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run bench:all > results.txt
      - name: Output Results
        run: cat results.txt
